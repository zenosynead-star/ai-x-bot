name: AI X Bot Daily Run

on:
  schedule:
    # UTC 22:00 = JST 07:00（毎日朝7時に実行）
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN: 投稿せず内容だけ確認（手動実行時のデフォルト）'
        type: boolean
        default: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI X Bot (scrape + reply + post)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # オリジナル投稿は一時停止中（返信制限解除の検知だけしたいため）
          # 制限解除されたら '3' に戻して再開
          MAX_POSTS_PER_DAY: '0'
          MAX_REPLIES_PER_DAY: '5'
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          # reply:   in_reply_to_tweet_id 指定のリプライのみ。403なら何もせずスキップ
          #          → 制限中は X 上に何も投稿されないが、メンション投稿でゴミも出ない
          #          → 制限解除されたら自動でリプライとして届く
          # auto:    リプライ試行 → 403 ならメンション投稿でフォールバック
          # mention: 本文先頭に@usernameを付けた通常投稿のみ
          REPLY_MODE: 'reply'
          PYTHONIOENCODING: 'utf-8'
        run: python main.py --scrape

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/
            history/
            today_trends.json
          retention-days: 30
          if-no-files-found: ignore
